<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色包与恢复</title>
<style>body{font:16px/1.6 system-ui;max-width:980px;margin:32px auto;padding:0 20px;color:#20252a;background:#f6f7f8}section{background:white;padding:20px;margin:16px 0;border:1px solid #d5dade;border-radius:10px}button,input,select{font:inherit;margin:5px;padding:7px}input[type=password]{width:24em;max-width:85%}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.45}label{display:block}</style>
<h1>角色包与恢复</h1><p><a href="__API_BASE__">本地记忆</a> · <a href="__API_BASE__/tools">本机工具</a></p>
<p>角色包包含七层人格、加密记忆和防重发摘要。账号、密钥、授权、设备许可与排程不迁移。导入后主动发送关闭，目标暂停，必须在本机重新核对。旧 QQ 受众范围会列为尚未绑定；新绑定不会重标历史私域。</p>
<section><label>独立口令（每次预览或隔离时重新输入；不保存）<input id="package-password" type="password" autocomplete="new-password"></label><details><summary>外部资产清单（可选，仅来源与许可信息）</summary><p>使用 name、version、source、license、sha256、required 字段。资产不会打包或下载；本机未验证的必需资产会阻止导入。</p><textarea id="package-assets" aria-label="外部资产清单 JSON" rows="4" cols="70">[]</textarea></details><button id="package-export" data-package-action>封存当前角色并预览</button><button id="package-download" data-package-action disabled>下载已批准角色包</button></section>
<section><label>加密角色包 <input id="package-file" type="file" accept=".scrole"></label><button id="package-upload" data-package-action>上传到隔离区</button><label>包 ID <input id="package-id" readonly></label><label>导入方式 <select id="package-mode"><option value="new">同 ID 新目标（必须不存在）</option><option value="restore_same_id">明确恢复已有同 ID 角色</option></select></label><button id="package-inspect" data-package-action>验证并预览</button><button id="package-stage" data-package-action disabled>备份目标并隔离准备</button></section>
<section><label><input id="package-consent" type="checkbox">我已核对角色 ID、包摘要、人格哈希、旧受众范围及未包含项目；同意所示操作，导入目标保持暂停。</label><button id="package-confirm" data-package-action disabled>确认当前核对内容</button><label>恢复操作 ID <input id="package-operation"></label><button id="package-status" data-package-action disabled>查询状态</button><button id="package-recover" data-package-action disabled>检查中断并生成新核对</button><button id="package-review" data-package-action disabled>确认本机删除记录并完成复审</button><button id="package-cancel" data-package-action disabled>取消或保留暂停</button><button id="package-diagnostics" data-package-action>本机诊断</button><p>提交响应丢失时仅查询状态。已提交的数据库不能回退到旧备份；中断后不会自动继续。</p></section>
<section><h2>当前核对与状态</h2><pre id="package-output" aria-live="polite">尚未创建或导入角色包。</pre></section>
<script type="module">__ROLE_PACKAGE_CLIENT__
mountRolePackages({document,fetch:window.fetch.bind(window),base:'__API_BASE__',token:'__SESSION_TOKEN__'});</script></html>
